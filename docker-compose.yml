# Local development stack: web (Flask debug server), RQ worker, PostgreSQL and Redis.
x-app: &app
  build: .
  env_file: config.env
  environment:
    APP_ENV: development
    DB_HOST: db
    REDIS_HOST: redis
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: flask run --debug --host=0.0.0.0 --port=5001
    ports:
      - "127.0.0.1:5001:5001"

  worker:
    <<: *app
    environment:
      APP_ENV: development
      DB_HOST: db
      REDIS_HOST: redis
      RUN_SETUP: "0"
    command: sh -c 'rq worker default --url "$$SESSION_REDIS"'

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-flaskthreeuser}
      POSTGRES_PASSWORD: ${DB_PASS:-flaskthreepassword}
      POSTGRES_DB: ${DB_NAME:-flaskthree}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
